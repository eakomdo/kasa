# Local production-like stack: PostgreSQL + Redis + the API.
#   docker compose up --build
#   docker compose exec api python manage.py seed_demo
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kasa
      POSTGRES_USER: kasa
      POSTGRES_PASSWORD: kasa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kasa']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: local-compose-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DJANGO_SECURE_SSL_REDIRECT: 'false'
      DATABASE_URL: postgres://kasa:kasa@db:5432/kasa
      CACHE_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      KHAYA_API_KEY: ${KHAYA_API_KEY:-}
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4"
    ports: ['8000:8000']
    volumes: [media:/app/media]
volumes:
  pgdata:
  media:
