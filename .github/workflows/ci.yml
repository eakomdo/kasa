name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: kasa, POSTGRES_USER: kasa, POSTGRES_PASSWORD: kasa }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kasa" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci
      DATABASE_URL: postgres://kasa:kasa@localhost:5432/kasa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py check --deploy --fail-level ERROR
        env: { DJANGO_DEBUG: 'false', DJANGO_ALLOWED_HOSTS: example.com }
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --create-db
